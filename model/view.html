<!doctype html>
<meta charset="utf-8">
<title>model view</title>
<style>html,body{margin:0;height:100%;background:#2a2838}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
// dev viewer: loads a GLB, frames it, and can post views to the local receiver
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const file = new URLSearchParams(location.search).get('f') || 'mv_white.glb';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight); document.body.append(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#2a2838');
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 100);
scene.add(new THREE.HemisphereLight('#fff', '#556', 1.4));
const key = new THREE.DirectionalLight('#fff', 2); key.position.set(2, 3, 4); scene.add(key);
const controls = new OrbitControls(cam, renderer.domElement);
const gltf = await new GLTFLoader().loadAsync(file);
const obj = gltf.scene; scene.add(obj);
obj.traverse(o => { if (o.isMesh) { if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals(); if (!o.material.map) o.material = new THREE.MeshStandardMaterial({ color: '#e8e2e6', roughness: 0.6, side: THREE.DoubleSide }); } });
const box = new THREE.Box3().setFromObject(obj), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
controls.target.copy(c);
const dist = size.y * 2.1;
window.view = (az, el = 0.1, zoom = 1, ty = 0) => {
  controls.target.set(c.x, c.y + ty * size.y, c.z);
  cam.position.set(c.x + Math.sin(az) * dist / zoom * Math.cos(el), c.y + ty * size.y + Math.sin(el) * dist / zoom, c.z + Math.cos(az) * dist / zoom * Math.cos(el));
  controls.update(); renderer.render(scene, cam);
};
window.shot = async (name, az, el, zoom, ty) => { view(az, el, zoom, ty); await fetch('http://127.0.0.1:8811/?name=' + name, { method: 'POST', body: renderer.domElement.toDataURL('image/png') }); };
window.info = { size: size.toArray(), tris: (() => { let n = 0; obj.traverse(o => { if (o.isMesh) n += o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3; }); return n; })() };
view(0);
(function loop() { controls.update(); renderer.render(scene, cam); requestAnimationFrame(loop); })();
</script>
