<!doctype html>
<meta charset="utf-8">
<title>face bake</title>
<style>html,body{margin:0;height:100%;background:#2a2838}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
// dev: bakes the front drawing onto the face of textured.glb, then exports a new GLB
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight); document.body.append(renderer.domElement);
const gltf = await new GLTFLoader().loadAsync('textured.glb');
gltf.scene.updateMatrixWorld(true);
let mesh; gltf.scene.traverse(o => { if (o.isMesh && !mesh) mesh = o; });
const geo = mesh.geometry; if (!geo.attributes.normal) geo.computeVertexNormals();
geo.computeBoundingBox();
const bb = geo.boundingBox.clone().applyMatrix4(mesh.matrixWorld);
const size = bb.getSize(new THREE.Vector3()), ctr = bb.getCenter(new THREE.Vector3());

const img = await new Promise(r => { const im = new Image(); im.onload = () => r(im); im.src = '../src/front_edit2.png'; });
const IMG = { w: 347, h: 751, x0: 59, x1: 335, y0: 31, y1: 729 };

// silhouette fit of the drawing to the mesh (scale, shift)
function fit() {
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height).data, W = c.width, H = c.height;
  const m = new Uint8Array(W * H); for (let i = 0; i < m.length; i++) m[i] = d[i * 4] + d[i * 4 + 1] + d[i * 4 + 2] < 750 ? 1 : 0;
  const P = geo.attributes.position.clone().applyMatrix4(mesh.matrixWorld).array, N = P.length / 3;
  let best = null;
  for (let sc = 0.9; sc <= 1.101; sc += 0.02) for (let dx = -30; dx <= 30; dx += 2) for (let dy = -24; dy <= 24; dy += 2) {
    const s = (IMG.y1 - IMG.y0) / size.y * sc, cx = (IMG.x0 + IMG.x1) / 2 + dx;
    const hit = new Uint8Array(W * H); let inside = 0;
    for (let i = 0; i < N; i++) {
      const px = Math.round(cx + (P[i * 3] - ctr.x) * s), py = Math.round(IMG.y0 + dy + (bb.max.y - P[i * 3 + 1]) * s);
      if (px < 0 || py < 0 || px >= W || py >= H) continue;
      const j = py * W + px; if (m[j]) inside++; hit[j] = 1;
    }
    let cov = 0, need = 0;
    for (let y = 0; y < H; y += 3) for (let x = 0; x < W; x += 3) { const j = y * W + x; if (!m[j]) continue; need++; let f = 0; for (let yy = -2; yy <= 2 && !f; yy++) for (let xx = -2; xx <= 2; xx++) if (hit[(y + yy) * W + x + xx]) { f = 1; break; } cov += f; }
    const prec = inside / N, rec = cov / need, f1 = 2 * prec * rec / (prec + rec);
    if (!best || f1 > best.f1) best = { sc, dx, dy, f1, s, cx };
  }
  return best;
}
const F = fit();

const tex = new THREE.Texture(img); tex.colorSpace = THREE.SRGBColorSpace; tex.needsUpdate = true;
const base = mesh.material.map;
const W = base.image.width, H = base.image.height;
// chin of the drawing (image y) -> mesh y
window.bake = (chinPx = 205, nz = [0.2, 0.55], bandPx = 14) => {
  const chinY = bb.max.y - (chinPx - IMG.y0 - F.dy) / F.s;
  const band = bandPx / F.s;
  const rt = new THREE.WebGLRenderTarget(W, H, { colorSpace: THREE.SRGBColorSpace });
  const sc = new THREE.Scene(), oc = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ map: base }));
  sc.add(quad);
  const bm = new THREE.ShaderMaterial({
    uniforms: { drawing: { value: tex }, s: { value: F.s }, cx: { value: F.cx }, top: { value: bb.max.y }, y0: { value: IMG.y0 + F.dy }, wh: { value: new THREE.Vector2(IMG.w, IMG.h) }, cX: { value: ctr.x }, chinY: { value: chinY }, band: { value: band }, nz: { value: new THREE.Vector2(...nz) }, model: { value: mesh.matrixWorld } },
    vertexShader: `uniform mat4 model; varying vec3 vP; varying vec3 vN; void main(){ vP = (model * vec4(position,1.0)).xyz; vN = normalize(mat3(model) * normal); gl_Position = vec4(uv * 2.0 - 1.0, 0.0, 1.0); }`,
    fragmentShader: `
      uniform sampler2D drawing; uniform float s, cx, top, y0, cX, chinY, band; uniform vec2 wh, nz; varying vec3 vP; varying vec3 vN;
      void main(){
        vec2 px = vec2(cx + (vP.x - cX) * s, y0 + (top - vP.y) * s);
        vec2 uv = vec2(px.x / wh.x, 1.0 - px.y / wh.y);
        vec4 c = texture2D(drawing, uv);
        float w = smoothstep(nz.x, nz.y, normalize(vN).z) * smoothstep(chinY - band, chinY + band, vP.y);
        gl_FragColor = vec4(c.rgb, w);
        #include <colorspace_fragment>
      }`,
    transparent: true, side: THREE.DoubleSide, depthTest: false,
  });
  const um = new THREE.Mesh(geo, bm); um.frustumCulled = false; sc.add(um);
  base.flipY = base.flipY; // glTF textures use flipY=false; UV space matches directly
  renderer.setRenderTarget(rt); renderer.render(sc, oc); renderer.setRenderTarget(null);
  const px = new Uint8Array(W * H * 4); renderer.readRenderTargetPixels(rt, 0, 0, W, H, px);
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const id = g.createImageData(W, H);
  id.data.set(px); // glTF uv v=0 is the image's top row, and so is render-target row 0 here
  g.putImageData(id, 0, 0);
  const nt = new THREE.CanvasTexture(c); nt.colorSpace = THREE.SRGBColorSpace; nt.flipY = false;
  window.newTex = nt; window.bakedCanvas = c;
  return { chinY, W, H };
};
// Laplacian smoothing of the front of the head; vertices are welded by position so UV seams stay closed
window.smoothHead = (iters = 8, chinY = 0.4667, zMin = 0.0, k = 0.6) => {
  const p = geo.attributes.position, idx = geo.index.array, n = p.count;
  const inv = mesh.matrixWorld.clone().invert(), v = new THREE.Vector3();
  const key = i => p.getX(i).toFixed(5) + ',' + p.getY(i).toFixed(5) + ',' + p.getZ(i).toFixed(5);
  const id = new Int32Array(n), groups = new Map(); let u = 0;
  for (let i = 0; i < n; i++) { const kk = key(i); if (!groups.has(kk)) groups.set(kk, u++); id[i] = groups.get(kk); }
  const nb = Array.from({ length: u }, () => new Set());
  for (let f = 0; f < idx.length; f += 3) for (let a = 0; a < 3; a++) { const x = id[idx[f + a]], y = id[idx[f + (a + 1) % 3]]; nb[x].add(y); nb[y].add(x); }
  const pos = new Float32Array(u * 3), rep = new Int32Array(u);
  for (let i = 0; i < n; i++) { rep[id[i]] = i; pos.set([p.getX(i), p.getY(i), p.getZ(i)], id[i] * 3); }
  // weight: only the front of the head, fading out toward the edges of the region
  const w = new Float32Array(u);
  for (let j = 0; j < u; j++) {
    v.set(pos[j * 3], pos[j * 3 + 1], pos[j * 3 + 2]).applyMatrix4(mesh.matrixWorld);
    w[j] = Math.min(1, Math.max(0, (v.y - chinY + 0.02) / 0.04)) * Math.min(1, Math.max(0, (v.z - zMin) / 0.04)) * Math.min(1, Math.max(0, (bb.max.y - 0.03 - v.y) / 0.05));
  }
  for (let it = 0; it < iters; it++) {
    const next = pos.slice();
    for (let j = 0; j < u; j++) {
      if (!w[j]) continue; let sx = 0, sy = 0, sz = 0; for (const q of nb[j]) { sx += pos[q * 3]; sy += pos[q * 3 + 1]; sz += pos[q * 3 + 2]; }
      const c = nb[j].size, a = k * w[j];
      next[j * 3] += (sx / c - pos[j * 3]) * a; next[j * 3 + 1] += (sy / c - pos[j * 3 + 1]) * a; next[j * 3 + 2] += (sz / c - pos[j * 3 + 2]) * a;
    }
    pos.set(next);
  }
  for (let i = 0; i < n; i++) p.setXYZ(i, pos[id[i] * 3], pos[id[i] * 3 + 1], pos[id[i] * 3 + 2]);
  p.needsUpdate = true; geo.computeVertexNormals();
  return u;
};
window.apply = () => { mesh.material.map = newTex; mesh.material.needsUpdate = true; };
const scene = new THREE.Scene(); scene.background = new THREE.Color('#2a2838'); scene.add(gltf.scene);
scene.add(new THREE.HemisphereLight('#fff', '#556', 1.6)); const key = new THREE.DirectionalLight('#fff', 1.6); key.position.set(1, 2, 3); scene.add(key);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 100);
const dist = size.y * 2.1;
window.shot = async (name, az, el = 0.05, zoom = 1, ty = 0) => {
  const t = new THREE.Vector3(ctr.x, ctr.y + ty * size.y, ctr.z);
  cam.position.set(t.x + Math.sin(az) * dist / zoom * Math.cos(el), t.y + Math.sin(el) * dist / zoom, t.z + Math.cos(az) * dist / zoom * Math.cos(el)); cam.lookAt(t);
  renderer.render(scene, cam);
  await fetch('http://127.0.0.1:8811/?name=' + name, { method: 'POST', body: renderer.domElement.toDataURL('image/png') });
};
window.exportGlb = async (name) => {
  const ab = await new GLTFExporter().parseAsync(gltf.scene, { binary: true });
  await fetch('http://127.0.0.1:8811/?ext=glb&name=' + name, { method: 'POST', body: ab });
};
window.F = F; window.info = { size: size.toArray(), ctr: ctr.toArray(), top: bb.max.y, fit: F, tex: [W, H] };
</script>
